spring.application.name=finance-dashboard

# Server Configuration - Accessible from Anywhere
server.address=0.0.0.0
server.port=${PORT:8080}
server.servlet.context-path=/api

# Database Configuration (H2 Embedded - No External DB Needed!)
spring.datasource.url=jdbc:h2:mem:financedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (optional - for debugging)
spring.h2.console.enabled=false

# JPA Configuration

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Configuration
# Set JWT_SECRET as an environment variable in production.
# NEVER use the default value in production!
jwt.secret=${JWT_SECRET:change_me_in_production_this_must_be_at_least_64_chars_long_for_hs512}
jwt.expiration=${JWT_EXPIRATION:86400000}
